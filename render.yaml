services:
  - type: web
    name: support-ticket-agent-api
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn api.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false           # set manually in Render dashboard
      - key: SQL_GEN_DB_PASSWORD
        sync: false           # set manually; must match what setup_deploy.py used
      - key: DATABASE_URL
        fromDatabase:
          name: support-ticket-db
          property: connectionString

databases:
  - name: support-ticket-db
    plan: free
    databaseName: support_tickets
    user: app
